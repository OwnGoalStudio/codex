# OwnGoal Studio defaults for jailbroken iOS.
# This is the system config layer (RootHide's `.jbroot/etc/codex/config.toml`
# or rootless `/var/jb/etc/codex/config.toml`). User `$CODEX_HOME/config.toml`
# overrides it.

file_opener = "none"
include_apps_instructions = false

[features]
# ChatGPT Apps / connectors (Figma, GitHub, Linear, …) need a desktop host.
apps = false

# Code Mode runs in the adjacent `codex-code-mode-host` process. Keep the
# under-development override off so model metadata selects the tool mode, but
# keep the stable host provider available for CodeMode/CodeModeOnly models.
code_mode = false
code_mode_host = true

# GUI / CDP / desktop-control surfaces. This is a terminal on a phone.
in_app_updates = false
in_app_browser = false
in_app_chat = false
in_app_dictation = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false

# Remote plugin marketplace pulls a large cache of desktop skills.
# Local plugins/skills in $CODEX_HOME still work.
remote_plugin = false
